version: '3.8'

services:
  # 1. NATS
  nats:
    image: nats:latest
    container_name: nats-ms3-local
    ports:
      - "4222:4222"
      - "8222:8222"

  # 2. POSTGRESQL
  postgres-db:
    image: postgres:16-alpine
    container_name: ms3-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=reservations_db
    ports:
      - "5433:5432" # DBeaver conecta a localhost:5433
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  # 3. TU MICROSERVICIO
  app: 
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ms3-service
    restart: always
    depends_on:
      - nats
      - postgres-db
    ports:
      # CORRECCIÓN AQUÍ:
      # Izquierda (8080): Puerto de tu PC (Windows) para Postman
      # Derecha (8080): Puerto donde escucha tu código Go (Gin)
      - "8081:8080" 
    environment:
      # Esta variable la ignoramos un poco si hardcodeaste el host en main.go,
      # pero es bueno tenerla bien.
      - NATS_URL=nats://nats-ms3-local:4222 
      - PORT=8081
    networks:
      - default